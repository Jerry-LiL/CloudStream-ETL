[project]
name = "cloudstream-etl"
version = "1.0.0"
description = "Bronze, silver, and gold lakehouse pipeline into a Snowflake star schema."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark==3.5.5",
    "boto3==1.44.11",
    "duckdb==2.0.1",
    "pyarrow==26.0.1",
    "python-dotenv==1.2.4",
    "pandas==3.1.1",
    "snowflake-connector-python==5.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "moto[s3]==5.2.6", "ruff==0.17.6"]

[project.scripts]
cloudstream = "cloudstream.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"dags/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
